name: CI

on:
  push:
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          AMK_WRANGLER_LOG: ${{ runner.temp }}/wrangler.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-logs
          path: ${{ runner.temp }}/wrangler.log
          retention-days: 3
          if-no-files-found: warn

  langs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node server/test/langs.js
      - run: node server/test/turkish.js

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - run: npm ci
      - run: npx cap sync android
      # The real file is the Firebase push config and stays out of git.
      - name: Stand-in google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789012", "project_id": "amerikano-ci", "firebase_url": "https://amerikano-ci.firebaseio.com", "storage_bucket": "amerikano-ci.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef", "android_client_info": {"package_name": "com.aytutuna.amerikano"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-stand-in-key-not-real"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
      - run: ./gradlew assembleDebug
        working-directory: android

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test -c test/browser/playwright.config.js
        env:
          AMK_WRANGLER_LOG: ${{ runner.temp }}/wrangler.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-shots
          path: |
            test/browser/out/shots
            test/browser/out/cutoff.txt
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report
          path: |
            test/browser/out/report
            test/browser/out/results
            ${{ runner.temp }}/wrangler.log
          retention-days: 7
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        run: |
          before='${{ github.event.before }}'
          ios=true
          if git cat-file -e "$before^{commit}" 2>/dev/null; then
            if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(ios/|package\.json$|package-lock\.json$|capacitor\.config\.json$|\.github/workflows/ci\.yml$)'; then ios=true; else ios=false; fi
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Swift package points into node_modules and the web assets are not committed.
      - run: npx cap sync ios
      - name: Pick a simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | .[0].udid')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100
      # GitHub release downloads fail now and then, and a binary target is fetched here.
      - name: Resolve packages
        run: |
          for i in 1 2 3 4; do
            xcodebuild -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -derivedDataPath "$RUNNER_TEMP/dd" && exit 0
            sleep 20
          done
          exit 1
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run and capture
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" com.aytutuna.amerikano
          for i in 1 2 3; do
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/launch-$i.png"
            sleep 1
          done
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/home.png"
          # A crashed app drops out of launchd's list or shows no pid.
          pid=$(xcrun simctl spawn "$UDID" launchctl list | awk '/UIKitApplication:com.aytutuna.amerikano/ {print $1}')
          if [ -z "$pid" ] || [ "$pid" = "-" ]; then
            echo "The app is not running"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-shots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn
